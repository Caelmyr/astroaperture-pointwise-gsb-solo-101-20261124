name: solo104-astro
services:
  desk:
    build:
      context: .
      args:
        ASTRO_RUNTIME_IMAGE: ${ASTRO_RUNTIME_IMAGE:-python:3.12-slim}
    image: ${ASTRO_IMAGE:-solo104-astro:1.0}
    network_mode: bridge
    environment:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    ports:
      - "127.0.0.1:${ASTRO_PORT:-19904}:8000"
    volumes:
      - astro-data:/var/lib/astro
    healthcheck:
      test: ["CMD", "python", "-B", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/astro/health', timeout=3).status==200"]
      interval: 3s
      timeout: 4s
      retries: 12
volumes:
  astro-data:
